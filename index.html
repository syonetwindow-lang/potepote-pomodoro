<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぽてぽてポモドーロ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #faf8f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      user-select: none;
    }
    .container { max-width: 400px; text-align: center; }
    .potato {
      width: 240px;
      height: 240px;
      margin: 0 auto 28px;
      transition: opacity 0.5s;
    }
    @media (max-width: 480px) {
      .potato { width: 180px; height: 180px; }
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .mode-label {
      font-size: 14px;
      color: #e8833a;
      font-weight: 600;
      margin-bottom: 24px;
      min-height: 20px;
    }
    .timer {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 32px;
      color: #222;
    }
    .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
    .btn {
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-start {
      background: #e8833a;
      color: #fff;
    }
    .btn-start:hover { background: #d4722e; }
    .btn-reset {
      background: #eee;
      color: #666;
    }
    .btn-reset:hover { background: #ddd; }
    .settings {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #888;
    }
    .setting-group input {
      width: 48px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #e8833a;
      border-radius: 3px;
      transition: width 1s linear;
      width: 0%;
    }
    .progress-fill.break-mode { background: #5bb35b; }
    footer { font-size: 11px; color: #ccc; margin-top: 12px; }
    footer a { color: #ccc; text-decoration: none; }
    footer a:hover { color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <img id="potato" src="work_normal.png" alt="ぽてぽて" class="potato">
    <h1>ぽてぽてポモドーロ</h1>
    <p id="modeLabel" class="mode-label"></p>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    <div id="timer" class="timer">50:00</div>

    <div class="settings" id="settingsArea">
      <div class="setting-group">
        <label for="workMin">作業</label>
        <input id="workMin" type="number" value="50" min="1" max="120">分
      </div>
      <div class="setting-group">
        <label for="breakMin">休憩</label>
        <input id="breakMin" type="number" value="10" min="1" max="60">分
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start">スタート</button>
      <button id="resetBtn" class="btn btn-reset">リセット</button>
    </div>

    <footer>
      <a href="https://github.com/syonetwindow-lang/potepote-pomodoro">GitHub</a>
    </footer>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const timerEl = $('timer');
    const startBtn = $('startBtn');
    const resetBtn = $('resetBtn');
    const progressEl = $('progress');
    const potatoEl = $('potato');
    const modeLabel = $('modeLabel');
    const settingsArea = $('settingsArea');
    const workMinInput = $('workMin');
    const breakMinInput = $('breakMin');

    let remaining = 50 * 60;
    let total = 50 * 60;
    let running = false;
    let interval = null;
    let isBreak = false;
    let potatoState = 0;
    const workImages = ['work_normal.png', 'work_glasses.png'];

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function updateDisplay() {
      timerEl.textContent = fmt(remaining);
      const pct = ((total - remaining) / total) * 100;
      progressEl.style.width = pct + '%';
      if (isBreak) {
        progressEl.classList.add('break-mode');
      } else {
        progressEl.classList.remove('break-mode');
      }
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = isBreak ? 523 : 440;
        gain.gain.value = 0.3;
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch(e) {}
    }

    function switchMode() {
      isBreak = !isBreak;
      if (isBreak) {
        total = parseInt(breakMinInput.value) * 60;
        potatoEl.src = 'break_relax.png';
        modeLabel.textContent = '休憩中';
        modeLabel.style.color = '#5bb35b';
      } else {
        total = parseInt(workMinInput.value) * 60;
        potatoState = (potatoState + 1) % workImages.length;
        potatoEl.src = workImages[potatoState];
        modeLabel.textContent = '作業中';
        modeLabel.style.color = '#e8833a';
      }
      remaining = total;
      updateDisplay();
    }

    function tick() {
      remaining--;
      if (remaining <= 5 && remaining > 0) {
        playBeep();
      }
      if (remaining <= 0) {
        playBeep();
        switchMode();
      }
      updateDisplay();
    }

    startBtn.addEventListener('click', () => {
      if (running) {
        clearInterval(interval);
        running = false;
        startBtn.textContent = '再開';
        settingsArea.style.display = 'flex';
      } else {
        if (!isBreak && remaining === total) {
          total = parseInt(workMinInput.value) * 60;
          remaining = total;
        }
        running = true;
        startBtn.textContent = '一時停止';
        modeLabel.textContent = isBreak ? '休憩中' : '作業中';
        modeLabel.style.color = isBreak ? '#5bb35b' : '#e8833a';
        settingsArea.style.display = 'none';
        interval = setInterval(tick, 1000);
      }
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(interval);
      running = false;
      isBreak = false;
      total = parseInt(workMinInput.value) * 60;
      remaining = total;
      potatoState = 0;
      potatoEl.src = workImages[0];
      startBtn.textContent = 'スタート';
      modeLabel.textContent = '';
      settingsArea.style.display = 'flex';
      updateDisplay();
    });

    workMinInput.addEventListener('change', () => {
      if (!running && !isBreak) {
        total = parseInt(workMinInput.value) * 60;
        remaining = total;
        updateDisplay();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
